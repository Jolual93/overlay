<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Pro para Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: transparent; /* Importante para el croma/transparencia */
            font-family: 'Rajdhani', sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Animación de brillo para el borde */
        @keyframes borderGlow {
            0% { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
            50% { border-color: #00ffee; box-shadow: 0 0 20px #00ffee; }
            100% { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
        }

        .animated-border {
            border: 2px solid #ff0055;
            animation: borderGlow 3s infinite;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Ticker de redes sociales */
        @keyframes slide {
            0% { transform: translateY(100%); opacity: 0; }
            5% { transform: translateY(0); opacity: 1; }
            30% { transform: translateY(0); opacity: 1; }
            35% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(-100%); opacity: 0; }
        }

        .social-item {
            position: absolute;
            animation: slide 12s infinite;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .social-item:nth-child(2) { animation-delay: 4s; }
        .social-item:nth-child(3) { animation-delay: 8s; }

        /* Barra de progreso */
        .progress-bar-fill {
            width: 65%; /* Este valor se puede cambiar con JS */
            transition: width 1s ease-in-out;
            background: linear-gradient(90deg, #ff0055, #ffdd00);
        }
    </style>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="relative w-full h-full p-6">
        
        <!-- 1. ESQUINA SUPERIOR IZQUIERDA: REDES SOCIALES -->
        <div class="absolute top-6 left-6 w-64 h-12 glass-panel rounded-lg overflow-hidden flex items-center px-4">
            <div class="relative w-full h-full">
                <div class="social-item">
                    <span class="bg-red-600 p-1 rounded">YT</span>
                    <span class="font-bold">TuCanalDeRakion</span>
                </div>
                <div class="social-item">
                    <span class="bg-blue-600 p-1 rounded">FB</span>
                    <span class="font-bold">Comunidad Rakion</span>
                </div>
                <div class="social-item">
                    <span class="bg-gradient-to-tr from-purple-500 to-pink-500 p-1 rounded">IG</span>
                    <span class="font-bold">@tu_usuario</span>
                </div>
            </div>
        </div>

        <!-- 2. MARCO DE CÁMARA (Opcional, se ajusta al tamaño de tu cámara en Studio) -->
        <div class="absolute top-6 right-6 w-48 h-48 animated-border rounded-lg flex items-center justify-center text-xs text-white/30 italic">
            Zona de Cámara
        </div>

        <!-- 3. BARRA DE METAS (CENTRO INFERIOR) -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-1/3">
            <div class="flex justify-between mb-2 text-sm font-bold uppercase tracking-widest">
                <span>Meta de Seguidores</span>
                <span id="goal-text">650 / 1000</span>
            </div>
            <div class="w-full h-4 bg-gray-800 rounded-full overflow-hidden border border-white/20">
                <div class="h-full progress-bar-fill shadow-[0_0_15px_rgba(255,0,85,0.5)]"></div>
            </div>
        </div>

        <!-- 4. PANEL DE EVENTOS / REGLAS (DERECHA INFERIOR) -->
        <div class="absolute bottom-10 right-6 w-64 glass-panel p-4 rounded-xl border-l-4 border-cyan-400">
            <h3 class="text-cyan-400 font-bold mb-1 uppercase text-sm">Sala Actual: Torneo</h3>
            <p class="text-xs text-gray-300">Reglas: No Pets, No Armor S, Solo Cell Basic.</p>
            <div class="mt-3 flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] uppercase">Servidor: Latino</span>
            </div>
        </div>

    </div>

    <script>
        // Función para actualizar la meta dinámicamente si fuera necesario
        function updateGoal(current, total) {
            const percentage = (current / total) * 100;
            document.querySelector('.progress-bar-fill').style.width = percentage + '%';
            document.getElementById('goal-text').innerText = `${current} / ${total}`;
        }

        // Ejemplo: Actualizar después de 2 segundos
        setTimeout(() => {
            updateGoal(720, 1000);
        }, 2000);
    </script>
</body>
</html>
